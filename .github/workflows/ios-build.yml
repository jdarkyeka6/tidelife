name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Everafter app icon
        run: |
          swift scripts/make_app_icon.swift TideLife/Assets.xcassets/AppIcon.appiconset/Icon-1024.png
          sips -s format jpeg TideLife/Assets.xcassets/AppIcon.appiconset/Icon-1024.png --out "$RUNNER_TEMP/everafter-icon.jpg" >/dev/null
          sips -s format png "$RUNNER_TEMP/everafter-icon.jpg" --out TideLife/Assets.xcassets/AppIcon.appiconset/Icon-1024.png >/dev/null

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build TideLife
        run: |
          xcodebuild \
            -project TideLife.xcodeproj \
            -scheme TideLife \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
