name: Upload Everafter to TideLife TestFlight

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tidelife-testflight
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Archive and upload Everafter
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BUNDLE_ID: com.jake.tidelife
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate existing Apple credentials
        shell: bash
        env:
          ASC_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          for value in "$APPLE_TEAM_ID" "$ASC_KEY_ID" "$ASC_ISSUER_ID" "$ASC_API_KEY_P8"; do
            if [ -z "$value" ]; then
              echo "::error::An Apple signing/API key secret is missing"
              exit 1
            fi
          done
          echo "APPLE_TEAM_ID=$(printf %s "$APPLE_TEAM_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "ASC_KEY_ID=$(printf %s "$ASC_KEY_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$(printf %s "$ASC_ISSUER_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Prepare existing App Store Connect key
        shell: bash
        env:
          ASC_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          if printf %s "$ASC_API_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            printf %s "$ASC_API_KEY_P8" > "$KEY_PATH"
          else
            ASC_API_KEY_P8="$ASC_API_KEY_P8" KEY_PATH="$KEY_PATH" python3 - <<'PY'
          import os, base64, pathlib, sys
          data = base64.b64decode(''.join(os.environ['ASC_API_KEY_P8'].split()), validate=True)
          if b'BEGIN PRIVATE KEY' not in data:
              sys.exit('The existing App Store Connect key is invalid')
          pathlib.Path(os.environ['KEY_PATH']).write_bytes(data)
          PY
          fi
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Generate Everafter app icon
        run: |
          swift scripts/make_app_icon.swift TideLife/Assets.xcassets/AppIcon.appiconset/Icon-1024.png
          sips -s format jpeg TideLife/Assets.xcassets/AppIcon.appiconset/Icon-1024.png --out "$RUNNER_TEMP/everafter-icon.jpg" >/dev/null
          sips -s format png "$RUNNER_TEMP/everafter-icon.jpg" --out TideLife/Assets.xcassets/AppIcon.appiconset/Icon-1024.png >/dev/null

      - name: Generate iOS project
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate

      - name: Confirm Everafter content is bundled
        shell: bash
        run: |
          test -s TideLife/Game/index.html
          grep -qi 'EVERAFTER' TideLife/Game/index.html
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Archive the confirmed Everafter build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild             -project TideLife.xcodeproj             -scheme TideLife             -configuration Release             -destination 'generic/platform=iOS'             -archivePath "$PWD/build/TideLife.xcarchive"             DEVELOPMENT_TEAM="$APPLE_TEAM_ID"             PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID"             CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             archive 2>&1 | tee build/xcode-archive.log

      - name: Confirm archived game resource and display name
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$PWD/build/TideLife.xcarchive/Products/Applications/TideLife.app"
          test -d "$APP_PATH"
          test -s "$APP_PATH/Game/index.html" || test -s "$APP_PATH/index.html"
          DISPLAY_NAME=$(/usr/libexec/PlistBuddy -c 'Print CFBundleDisplayName' "$APP_PATH/Info.plist")
          [ "$DISPLAY_NAME" = "Everafter" ]

      - name: Import an existing Apple Distribution p12 (never create/revoke certificates)
        shell: bash
        env:
          DIST_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$DIST_P12_BASE64" ] || [ -z "$DIST_P12_PASSWORD" ]; then
            echo "::error::TestFlight upload needs an existing Apple Distribution p12 and password. Set APPLE_DISTRIBUTION_P12_BASE64 and APPLE_DISTRIBUTION_P12_PASSWORD in GitHub Actions Secrets. Apple's distribution certificate limit is already reached: do not automatically create or revoke certificates."
            exit 1
          fi
          P12="$RUNNER_TEMP/existing-apple-distribution.p12"
          printf '%s' "$DIST_P12_BASE64" | base64 -D > "$P12"
          chmod 600 "$P12"
          KEYCHAIN="$RUNNER_TEMP/everafter-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -P "$DIST_P12_PASSWORD" -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q 'Apple Distribution'

      - name: Install Fastlane and select the matching existing profile
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Download profile matching the installed certificate
        shell: bash
        run: |
          set -euo pipefail
          bundle exec fastlane ios prepare_profile
          PROFILE_FILE="$RUNNER_TEMP/TideLife_AppStore.mobileprovision"
          security cms -D -i "$PROFILE_FILE" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          [ -n "$PROFILE_UUID" ] || exit 1
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Configure manual signing with the actual installed profile UUID
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>${BUNDLE_ID}</key><string>${PROFILE_UUID}</string></dict>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>destination</key><string>export</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST

      - name: Export iOS IPA using existing API key
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild             -exportArchive             -archivePath "$PWD/build/TideLife.xcarchive"             -exportPath "$PWD/build/export"             -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"             -allowProvisioningUpdates             -authenticationKeyPath "$ASC_KEY_PATH"             -authenticationKeyID "$ASC_KEY_ID"             -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee build/export.log
          IPA_PATH=$(find "$PWD/build/export" -maxdepth 1 -name '*.ipa' -print -quit)
          [ -n "$IPA_PATH" ] || { echo "::error::No IPA was produced"; exit 1; }
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Upload Everafter to TideLife's TestFlight record
        shell: bash
        run: |
          set -euo pipefail
          xcrun altool             --upload-app             --type ios             --file "$IPA_PATH"             --apiKey "$ASC_KEY_ID"             --apiIssuer "$ASC_ISSUER_ID"

      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everafter-tidelife-${{ github.run_number }}
          path: |
            build/xcode-archive.log
            build/export.log
            build/export/*.ipa
          if-no-files-found: warn
